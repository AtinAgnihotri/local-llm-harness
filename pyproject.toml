[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-harness"
version = "0.1.0"
description = "Private offline local LLM harness and CLI coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
local-harness = "local_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

